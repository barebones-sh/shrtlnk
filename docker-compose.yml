services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shrtlnk
      POSTGRES_PASSWORD: shrtlnk
      POSTGRES_DB: shrtlnk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shrtlnk -d shrtlnk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://shrtlnk:shrtlnk@db:5432/shrtlnk
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://shrtlnk:shrtlnk@db:5432/shrtlnk
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (openssl rand -base64 32)}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
